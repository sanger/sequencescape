limber_ultima_htp_conversion: &limber_ultima_conversion
  name: Limber Ultima HTP Conversion
  asset_type: Well
  order: 2
  request_class_name: UltimaConversionRequest
  for_multiplexing: false
  billable: true
  product_line_name: Ultima
  acceptable_purposes:
    - LB Lib PCR-XP
    - LTN Lib PCR XP
    - RVI Lib PCR XP
    - RVIG Lib PCR XP
    - LBB Lib PCR-XP
    - LBB Lib PCR-XP Norm

limber_multiplexing_ultima_htp: &limber_multiplexing_ultima_htp
  name: Limber Multiplexing Ultima HTP
  asset_type: Well
  order: 2
  request_class_name: Request::Multiplexing
  for_multiplexing: true
  product_line_name: Ultima
  target_purpose_name: UHTP Lib Pool Norm

limber_multiplexing_ultima_ltp:
  <<: *limber_multiplexing_ultima_htp
  name: Limber Multiplexing Ultima LTP
  target_purpose_name: ULTP Lib Pool Norm

# Aggregates wells from one or more Illumina library plates into ULTP DNA Norm.
# Partial submissions are allowed; only the submitted wells are aggregated.
# The requests are passed by work completion on ULTP DNA Norm.
limber_ultima_ltp_aggregation:
  name: Limber Ultima LTP Aggregation
  asset_type: Well
  order: 1
  request_class_name: CustomerRequest
  for_multiplexing: false
  billable: false
  product_line_name: Ultima
  acceptable_purposes:
    - LB Lib PCR-XP
    - LTN Lib PCR XP
    - RVI Lib PCR XP
    - RVIG Lib PCR XP
    - LBB Lib PCR-XP
    - LBB Lib PCR-XP Norm
    - Library Stock Plate

# The conversion submission is made on ULTP DNA Norm after aggregation, or
# directly on a Library Stock Plate (libraries from faculty).
limber_ultima_ltp_conversion:
  <<: *limber_ultima_conversion
  name: Limber Ultima LTP Conversion
  acceptable_purposes:
    - ULTP DNA Norm
    - Library Stock Plate

# The conversion submission is made directly on Illumina library plates (XP
# plates or Library Stock Plates), or on ULTP DNA Norm.
# The purposes are not checked for this request class (UltimaConversionRequest
# is a CustomerRequest).
limber_ultima_ltp_conversion:
  name: Limber Ultima LTP Conversion
  asset_type: Well
  order: 2
  request_class_name: UltimaConversionRequest
  for_multiplexing: false
  billable: true
  product_line_name: Ultima
  acceptable_purposes:
    - ULTP DNA Norm
    - LB Lib PCR-XP
    - LTN Lib PCR XP
    - RVI Lib PCR XP
    - RVIG Lib PCR XP
    - LBB Lib PCR-XP
    - LBB Lib PCR-XP Norm
    - Library Stock Plate

limber_multiplexing_ultima_ltp:
  name: Limber Multiplexing Ultima LTP
  asset_type: Well
  order: 2
  request_class_name: Request::Multiplexing
  for_multiplexing: true
  product_line_name: Ultima
  target_purpose_name: ULTP Lib Pool Norm
